schema_version: 1

context:
  name: speedy-antlr-tool
  version: "1.4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: eff834dc40d843550ed25fc72c013af3ddf899d8e70e7b79491f3afdbfc067ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - antlr4-python3-runtime >=4.10,<4.14
    - jinja2

tests:
  - python:
      imports:
        - speedy_antlr_tool
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Generate an accelerator extension that makes your Antlr parser in Python super-fast!
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/amykyta3/speedy-antlr-tool
  repository: https://github.com/amykyta3/speedy-antlr-tool

extra:
  recipe-maintainers:
    - svengiegerich
    - janjagusch
